# ---------------------------------------------------------------------------
# Corrections to the fact-check table in docs/investment-strategy.md.
# Five of seven symbols listed there as fake are real SEC registrants. Every one
# is a 2025-2026 listing, which is the pattern: a model checking from training
# data misses recent listings, and recent listings are exactly what a discovery
# system is for. Verified via theses/data/validate_tickers.py.
# ---------------------------------------------------------------------------
ticker_corrections:
  SNDK: {verdict: real, name: Sandisk Corp, cik: "0002023554", doc_said: "delisted 2016"}
  IMSR: {verdict: real, name: Terrestrial Energy Inc., cik: "0002019804", doc_said: "reactor model name"}
  INFQ: {verdict: real, name: Infleqtion Inc., cik: "0002007825", doc_said: "no such company", note: "quantum - an active theme here"}
  FLY:  {verdict: real, name: Firefly Aerospace Inc., cik: "0001860160", doc_said: "no pure-play found", note: "space - an active theme here"}
  PURR: {verdict: real, name: Hyperliquid Strategies Inc, cik: "0002078856", doc_said: "suspected meme coin"}
  DRAM: {verdict: not_an_sec_registrant, doc_said: "technical term", note: "doc was right"}
  HUMN: {verdict: not_an_sec_registrant, doc_said: "no match found", note: "doc was right"}
