# Watchlist and the rules that govern acting on it.
#
# The tiers come from docs/investment-strategy.md: a name only earns daily
# attention if it could plausibly be bought soon. Everything else is watched by
# the signal engine so it does not consume attention until it moves.
#
# The `rules` block exists so that decisions rest on numbers written down while
# calm, rather than on judgement made while wanting to buy something. The
# preflight skill reads these; it does not invent them.
#
# Values marked `confirmed: false` are Claude's defaults with reasoning, not the
# owner's decisions. Preflight surfaces them as unset rather than enforcing them.

owner:
  base_currency: AUD
  tax_residency: AU
  broker: CommSec
  positions_held: none          # as of 2026-08-16 - nothing bought yet
  experience: beginner

rules:

  position_sizing:
    # A good thesis at a large weight is still a risk-management failure. These
    # cap how wrong any single decision can be, which matters more for a first
    # portfolio than picking well does.
    max_single_position_pct_of_portfolio: 5
    max_theme_pct_of_portfolio: 25
    max_satellite_pct_of_portfolio: 30
    confirmed: false
    rationale: >
      Defaults, not decisions. 5% means a total loss on one name costs 5% of the
      portfolio - survivable, and small enough that being wrong is not ruinous.
      The theme cap matters more here than the single-name cap: this watchlist is
      one bet (AI compute) wearing thirty tickers, so caps applied per name would
      permit a concentrated theme bet while looking diversified.
    look_through_etfs: true
    note: >
      Exposure counts holdings inside ETFs, not just direct lines. SMH is roughly
      48% NVDA + TSM + AVGO + AMD + MU; buying SMH alongside those names
      concentrates rather than diversifies.

  currency:
    # Every US position is also an AUD/USD bet. This is absent from the strategy
    # document and is a material omission for an AUD-based investor in US equity.
    report_returns_in: AUD
    record_fx_at_entry: true
    note: >
      A 20% gain in USD is zero in AUD if the Australian dollar rises 20% over the
      same period. Returns quoted in USD are not the return actually earned.
      Some ASX-listed ETFs offer a currency-hedged share class alongside the
      unhedged one - worth checking for any ETF held as core, where the FX bet is
      unintended rather than deliberate.
    hedged_alternatives_checked: false

  tax:
    # Not tax advice. Confirm with an Australian accountant before relying on it.
    cgt_discount_min_holding_days: 365
    note: >
      Australian individuals may receive a 50% CGT discount on assets held longer
      than 12 months. Selling at month 11 rather than month 13 can therefore cost
      materially more after tax on the same gross gain. This interacts directly
      with a thesis-driven horizon: an exit trigger firing near the 12-month mark
      deserves the tax cost stated explicitly rather than discovered later.
    us_dividend_withholding: >
      Under Article 10 of the Australia-US treaty, withholding on US dividends to
      an Australian resident portfolio investor is generally capped at 15% rather
      than the default 30%. The reduced rate is claimed by lodging a W-8BEN with
      the broker, not with the IRS.
    w8ben_lodged: probably_yes
    w8ben_note: >
      CommSec requires a W-8BEN to open an International Shares Account, so one is
      almost certainly already on file - an international account exists and is
      quoting US prices. The thing to check is not whether it was lodged but
      whether it has expired.
    w8ben_expiry_rule: >
      Valid until 31 December of the third calendar year after signing, and
      invalidated earlier by a change of name or residency. Verify the current
      status in CommSec's W-8 Hub before relying on the 15% rate.
    w8ben_scope: >
      Applies to US-domiciled holdings. ASX-listed ETFs such as NDQ and IEM give
      US exposure through an Australian structure and do not need it.
    us_estate_tax_note: >
      Separately, US-domiciled securities can expose a non-resident holder to US
      estate tax above a low threshold. This is a real consideration when choosing
      between a US-listed ETF and an ASX-listed equivalent holding the same
      companies. Confirm the current threshold and treatment with an Australian
      accountant - it is not settled from here.
    verify_with_professional: true

  entry:
    tranches_pct: [20, 40, 40]
    note: >
      Three tranches, from the strategy document. Each tranche is a separate
      brokerage fee, so on small parcels the fee drag is real - size the first
      tranche so costs stay a sensible fraction of it.
    ath_caution: true
    ath_note: >
      The strategy document already flags buying near all-time highs. Preflight
      surfaces it as a warning to acknowledge, not a block.

  exit:
    require_written_trigger: true
    note: >
      No position is entered without a written number that would end it. A
      position with no exit condition is a position that will be held through
      anything.

  discipline:
    core_satellite: true
    note: >
      From the strategy document: ETF core compounds, single names are satellite.
      Never sell compounding core to fund a satellite position. The 1.1^x versus
      x^2 comparison in that document is the anchor - compounding needs a fixed
      percentage each year, while active selection needs an ever-larger absolute
      gain to keep pace, which no one delivers annually.
    record_decisions_not_taken: true
    record_note: >
      Names passed on are logged with the reason. Memory keeps the wins and
      discards the passes, so without a written record there is nothing to
      calibrate judgement against.

